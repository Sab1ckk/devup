services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devup
      POSTGRES_USER: devup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
  backend:
    profiles: ['app']
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://devup:${POSTGRES_PASSWORD}@postgres:5432/devup
      MEDIA_ROOT: /app/media
    ports: ['8000:8000']
    volumes: ['media_data:/app/media']
    depends_on: ['postgres']

volumes:
  postgres_data:
  media_data:

